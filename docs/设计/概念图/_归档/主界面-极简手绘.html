<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniverIdle — 极简手绘 UI（完整技能栏）</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #ddd8ce;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Noto Serif SC", serif;
      color: #2c2824;
    }
    .note { font-size: 11px; color: #7a7468; margin-bottom: 10px; }
    .frame {
      width: 920px;
      max-width: 100%;
      height: 580px;
      background: #f6f2e8;
      border: 2px solid #2c2824;
      border-radius: 3px 6px 4px 5px;
      box-shadow: 3px 4px 0 #2c2824;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top {
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-bottom: 1.5px solid #2c2824;
    }
    .top h1 {
      font-family: "Ma Shan Zheng", cursive;
      font-size: 26px;
      font-weight: 400;
    }
    .top .links { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
    .top .links span {
      text-decoration: underline;
      text-decoration-style: wavy;
      text-underline-offset: 3px;
      color: #5a554c;
      cursor: default;
    }
    .main { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 130px;
      border-right: 1.5px solid #2c2824;
      padding: 10px 0;
      overflow-y: auto;
    }
    .skill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      font-size: 14px;
      color: #5a554c;
      border-left: 3px solid transparent;
    }
    .skill.active {
      color: #2c2824;
      background: rgba(184, 92, 56, 0.08);
      border-left-color: #b85c38;
    }
    .skill svg { width: 22px; height: 22px; flex-shrink: 0; }
    .content {
      flex: 1;
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
    }
    .crumb { font-size: 13px; color: #8a8278; margin-bottom: 6px; }
    .crumb strong { color: #2c2824; font-weight: 500; }
    .dash {
      height: 1px;
      margin: 12px 0 16px;
      background: repeating-linear-gradient(90deg, #2c2824 0, #2c2824 5px, transparent 5px, transparent 10px);
      opacity: 0.35;
    }
    .actions { flex: 1; }
    .action {
      display: flex;
      justify-content: space-between;
      padding: 11px 4px;
      border-bottom: 1px solid rgba(44,40,36,0.1);
      font-size: 15px;
    }
    .action.active .label { color: #b85c38; }
    .action.locked { opacity: 0.35; }
    .action .meta { color: #8a8278; font-size: 13px; }
    .now { margin-top: 16px; }
    .now p { font-size: 12px; color: #8a8278; margin-bottom: 8px; }
    .progress svg { width: 100%; height: 20px; }
    .inv {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1.5px dashed rgba(44,40,36,0.25);
      font-size: 13px;
      color: #6a6458;
    }
    .inv span { margin-right: 16px; }
  </style>
</head>
<body>
  <p class="note">UniverIdle · 极简手绘 UI · 玩法结构不变（左技能栏）· 仅换视觉</p>

  <div class="frame">
    <header class="top">
      <h1>坠星谷</h1>
      <div class="links"><span>图鉴</span><span>设置</span></div>
    </header>
    <div class="main">
      <nav class="sidebar">
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 18 L8 6 L14 10 L20 4"/><circle cx="18" cy="6" r="2"/></svg>
          打猎
        </div>
        <div class="skill active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 16 Q12 6 20 14"/><circle cx="19" cy="13" r="2"/></svg>
          溪钓
        </div>
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18 Q12 8 18 16"/><path d="M10 12 L14 12"/></svg>
          野拾
        </div>
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="10" width="8" height="8"/><path d="M12 4 L12 10"/></svg>
          掘矿
        </div>
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 18 L10 8 L16 10 L14 18 Z"/><path d="M6 20 L18 20"/></svg>
          炼药
        </div>
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18 L10 6 L14 6 L18 18 Z"/><path d="M4 18 L20 18"/></svg>
          锻造
        </div>
        <div class="skill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18 L6 10 L14 6 L18 14 L12 18 Z"/></svg>
          讨伐
        </div>
      </nav>
      <main class="content">
        <div class="crumb">溪钓 › <strong>萤溪</strong></div>
        <div class="dash"></div>
        <div class="actions">
          <div class="action active">
            <span class="label">钓萤虾</span>
            <span class="meta">8秒</span>
          </div>
          <div class="action">
            <span class="label">钓鳟鱼</span>
            <span class="meta">12秒 · Lv.10</span>
          </div>
          <div class="action locked">
            <span class="label">坑底烫潭 · 赤尾鳗</span>
            <span class="meta">🔒</span>
          </div>
        </div>
        <section class="now">
          <p>进行中</p>
          <div class="progress">
            <svg viewBox="0 0 400 20" preserveAspectRatio="none">
              <path d="M2 11 Q100 7 200 10 T398 9" stroke="#2c2824" stroke-width="1.5" fill="none"/>
              <path d="M2 11 Q100 7 200 10 T260 9" stroke="#b85c38" stroke-width="2.5" fill="none"/>
              <circle cx="260" cy="9" r="4" fill="#b85c38"/>
            </svg>
          </div>
        </section>
        <footer class="inv">
          <span>虾 48</span>
          <span>苔 22</span>
          <span>红药 3</span>
          <span>铜锭 6</span>
        </footer>
      </main>
    </div>
  </div>
</body>
</html>
